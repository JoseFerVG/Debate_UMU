<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier y Galería Informativa | Club de Debate UMU</title>
  <meta name="description" content="Galería de imágenes, actividades formativas y presentación del Club de Debate de la Universidad de Murcia." />
  <link rel="canonical" href="https://josefervg.github.io/Debate_UMU/pagpubli/canvaInfo.html" />
  <link rel="icon" href="../img/logos/LogoClubBocatas.png" />

  <!-- GEO & Local SEO -->
  <meta name="geo.region" content="ES-MU" />
  <meta name="geo.placename" content="Murcia" />
  <meta name="geo.position" content="38.0163;-1.1685" />
  <meta name="ICBM" content="38.0163, -1.1685" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .frase { font-family: 'Montserrat', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to   { opacity: 1; transform: scale(1); }
    }
    .my-aspect-video {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #111;
    }
    .my-aspect-video > * {
      position: absolute;
      inset: 0;
    }
    .dot { width:10px; height:10px; border-radius:9999px; background:#222; opacity:.5; }
    .dot.active { opacity:1; transform:scale(1.15); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-black">

  <!-- HERO -->
  <section class="flex flex-col items-center justify-center text-center px-6 py-12">
    <h1 class="frase text-5xl sm:text-7xl font-extrabold uppercase leading-tight drop-shadow-lg">
      ¿Quieres que tus <br>
      <span class="bg-black text-pink-400 px-3">ideas hagan ruido?</span>
    </h1>
    <p class="mt-6 text-lg sm:text-xl font-medium">
      Debate, lo estás deseando.<br>
      <span class="underline decoration-pink-600 font-bold">Y 3 CRÉDITOS</span> que te llevas.
    </p>
  </section>

  <!-- GALERÍA / CARRUSEL -->
  <section class="px-6 py-4 text-center">
    <h2 class="frase text-4xl sm:text-5xl uppercase text-black mb-6 drop-shadow-lg flex items-center justify-center gap-3">
      <svg class="w-10 h-10 text-pink-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
      </svg>
      Galería del Club
    </h2>

    <div class="relative max-w-4xl mx-auto">
      <!-- Contenedor 16:9 -->
      <div id="carousel" class="my-aspect-video rounded-3xl shadow-xl border-4 border-black">
        <!-- loader -->
        <div id="loader" class="absolute inset-0 flex items-center justify-center">
          <div class="animate-spin border-4 border-transparent border-t-black rounded-full w-10 h-10"></div>
        </div>

        <img id="carousel-img"
             src=""
             alt="Foto del Club de Debate UMU"
             class="w-full h-full object-cover transition-all duration-500 fade-in" />
      </div>

      <!-- Botones de navegación -->
      <button id="prevBtn" type="button" aria-label="Foto anterior"
              class="absolute top-1/2 left-3 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-3 rounded-full transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
        </svg>
      </button>
      <button id="nextBtn" type="button" aria-label="Siguiente foto"
              class="absolute top-1/2 right-3 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-3 rounded-full transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
        </svg>
      </button>

      <!-- Dots -->
      <div id="dots" class="flex justify-center mt-3 gap-2"></div>
    </div>

    <!-- Botón volver -->
    <a href="index.html"
       class="mt-6 inline-flex items-center gap-2 bg-pink-500 text-white text-xl font-extrabold py-3.5 px-7 rounded-2xl shadow-lg hover:scale-105 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
      Volver
    </a>
  </section>

  <!-- FOOTER -->
  <footer class="py-6 text-center text-xs bg-black text-white w-full space-y-2">
    <p>© <span id="year"></span> Club de Debate UMU — Universidad de Murcia</p>
    <nav aria-label="Información legal" class="flex flex-wrap justify-center gap-x-3 gap-y-1 text-zinc-400 text-[11px]">
      <a href="../legal/aviso-legal.html" class="hover:text-white hover:underline">Aviso Legal</a> ·
      <a href="../legal/privacidad.html" class="hover:text-white hover:underline">Privacidad</a> ·
      <a href="../legal/cookies.html" class="hover:text-white hover:underline">Cookies</a> ·
      <a href="../legal/terminos.html" class="hover:text-white hover:underline">Términos</a>
    </nav>
  </footer>

  <script>
    // Paleta fosforita
    const colores = ["#fffb00","#39ff14","#00f0ff"];
    document.body.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];

    // Año dinámico
    document.getElementById('year').textContent = new Date().getFullYear();

    // IMÁGENES 
    const images = [
      "https://raw.githubusercontent.com/JoseFerVG/Debate_UMU/main/img/imagenesInfo/info%281%29.jpg",
      "https://raw.githubusercontent.com/JoseFerVG/Debate_UMU/main/img/imagenesInfo/info%282%29.jpg",
      "https://raw.githubusercontent.com/JoseFerVG/Debate_UMU/main/img/imagenesInfo/info%283%29.jpg",
      "https://raw.githubusercontent.com/JoseFerVG/Debate_UMU/main/img/imagenesInfo/info%284%29.jpg",
      "https://raw.githubusercontent.com/JoseFerVG/Debate_UMU/main/img/imagenesInfo/info%285%29.jpg"
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('carousel-img');
    const loader = document.getElementById('loader');
    const dotsContainer = document.getElementById('dots');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const carousel = document.getElementById('carousel');

    // Crear dots
    function buildDots() {
      dotsContainer.innerHTML = "";
      images.forEach((_, i) => {
        const d = document.createElement('button');
        d.type = "button";
        d.className = "dot";
        d.setAttribute('aria-label', 'Ir a imagen ' + (i+1));
        d.addEventListener('click', () => { showImage(i); });
        dotsContainer.appendChild(d);
      });
      updateDots();
    }

    function updateDots() {
      Array.from(dotsContainer.children).forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    // Mostrar imagen con precarga y animación
    function showImage(index) {
      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;
      currentIndex = index;

      loader.style.display = "flex";
      imgElement.style.opacity = 0;

      const preloader = new Image();
      preloader.src = images[currentIndex];
      preloader.onload = () => {
        imgElement.src = images[currentIndex];
        loader.style.display = "none";
        imgElement.style.opacity = 1;
        imgElement.classList.remove('fade-in');
        void imgElement.offsetWidth;
        imgElement.classList.add('fade-in');
      };

      updateDots();
    }

    nextBtn.addEventListener('click', () => showImage(currentIndex + 1));
    prevBtn.addEventListener('click', () => showImage(currentIndex - 1));

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') showImage(currentIndex + 1);
      if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
    });

    // Touch / Swipe
    let touchStartX = 0;
    let touchEndX = 0;

    carousel.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    carousel.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, {passive: true});

    function handleSwipe() {
      const threshold = 40;
      if (touchEndX < touchStartX - threshold) {
        showImage(currentIndex + 1);
      } else if (touchEndX > touchStartX + threshold) {
        showImage(currentIndex - 1);
      }
    }

    // Inicializar
    buildDots();
    showImage(0);
  </script>
  <script src="../legal/banner.js"></script>
</body>
</html>
